<!doctype html>
<html lang="{{LANG}}" data-page="gallery">
<head>
{{HEAD}}
</head>
<body>
{{HEADER}}
<main id="main">
  <section class="intro" data-intro aria-labelledby="intro-title">
    <div class="wrap intro__body">
      <h1 id="intro-title">{{t:gallery.title}}</h1>
      <p class="intro__lead">{{t:gallery.lead}}</p>
    </div>
  </section>

  <section class="wrap gallery" aria-labelledby="gallery-title">
    <h2 id="gallery-title" class="visually-hidden">{{t:gallery.heading}}</h2>
    <!-- Two filters, the subject (the closed set of categories) and the theme the effect draws, and the order. -->
    <div class="gallery__bar">
      <div class="gallery__picks">
        <sf-dropdown size="1/2" aria-label="{{t:gallery.categories}}" value="all" search="false" data-categories></sf-dropdown>
        <sf-dropdown size="1/2" aria-label="{{t:gallery.schemes}}" value="all" search="false" data-schemes></sf-dropdown>
        <sf-dropdown size="1/2" aria-label="{{t:gallery.sort}}" value="catalogue" search="false" data-sort hidden></sf-dropdown>
      </div>
    </div>
    <ul class="cards" data-cards></ul>
    <p class="gallery__empty muted" data-empty hidden>{{t:gallery.empty}}</p>
  </section>
</main>
{{FOOTER}}
<script type="module" src="{{ROOT}}assets/gallery.js"></script>
</body>
</html>
