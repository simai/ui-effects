<!doctype html>
<html lang="ru" data-page="gallery">
<head>
{{HEAD}}
</head>
<body>
{{HEADER}}
<main id="main">
  <section class="intro" data-intro aria-labelledby="intro-title">
    <div class="wrap intro__body">
      <h1 id="intro-title">Фоновые эффекты</h1>
      <p class="intro__lead">Живые фоны для SIMAI Framework. Подключаются одной строкой.</p>
    </div>
  </section>

  <section class="wrap gallery" aria-labelledby="gallery-title">
    <h2 id="gallery-title" class="visually-hidden">Галерея</h2>
    <div class="gallery__bar">
      <sf-button-group appearance="segmented" aria-label="Фильтр по схемам" value="all" data-filters
        items='[{"value":"all","label":"Все"},{"value":"dual","label":"Двухтемные"},{"value":"dark","label":"Тёмные"},{"value":"light","label":"Светлые"}]'></sf-button-group>
    </div>
    <ul class="cards" data-cards></ul>
  </section>
</main>
{{FOOTER}}
<script type="module" src="{{ROOT}}assets/gallery.js"></script>
</body>
</html>
