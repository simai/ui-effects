<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{DESCRIPTION}}">
{{CANONICAL}}<meta name="color-scheme" content="light dark">
<title>{{TITLE}}</title>
<script>
  // The site theme before the first paint: the reader's choice, else the system.
  (function () {
    var theme = null;
    try { theme = localStorage.getItem('ui-effects-theme'); } catch (error) { theme = null; }
    if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.classList.add('theme-' + theme);
  })();
</script>
<script type="application/json" id="site-config">{{CONFIG}}</script>
<link rel="stylesheet" href="{{FRAMEWORK_BASE}}core/css/core.min.css">
<script>
  window.sfPath = '{{FRAMEWORK_BASE}}';
  // The site chooses the theme itself (the switch above); no preloader. Effects
  // come from this site's own copy of the catalogue, the same commit it was built from.
  window.SF_BOOT_CONFIG = {theme: false, preloader: {enabled: false}, effects: {catalogue: '{{ROOT}}'}};
</script>
<script src="{{FRAMEWORK_BASE}}core/js/core.min.js"></script>
<link rel="stylesheet" href="{{ROOT}}assets/site.css">
