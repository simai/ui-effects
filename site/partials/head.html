<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{DESCRIPTION}}">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}}</title>
<script>
  // The site theme before the first paint, as the Framework's Loader keeps it:
  // the reader's choice in its sf-theme cookie, else the system.
  (function () {
    var chosen = document.cookie.match(/(?:^|; )sf-theme=(light|dark)(?:;|$)/);
    var theme = chosen ? chosen[1] : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.classList.add('theme-' + theme);
  })();
</script>
<script type="application/json" id="site-config">{{CONFIG}}</script>
<link rel="stylesheet" href="{{FRAMEWORK_BASE}}core/css/core.min.css">
<script>
  window.sfPath = '{{FRAMEWORK_BASE}}';
  // The Loader keeps the light or dark theme (its theme switch sets it); no
  // preloader. Effects come from this site's own copy of the catalogue, the
  // same commit it was built from.
  window.SF_BOOT_CONFIG = {preloader: {enabled: false}, effects: {catalogue: '{{ROOT}}'}};
</script>
<script src="{{FRAMEWORK_BASE}}core/js/core.min.js"></script>
<script>
  // The reader's main colour, if they chose one: the whole theme from it before the first paint.
  (function () {
    var colour = null;
    try { colour = localStorage.getItem('ui-effects-colour'); } catch (error) { colour = null; }
    var palette = window.SF && window.SF.ThemePalette;
    if (colour && palette && palette.isThemeColor(colour)) palette.applyTheme(palette.themeFromColor(colour));
  })();
</script>
<link rel="stylesheet" href="{{ROOT}}assets/site.css">
