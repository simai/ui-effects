name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Everything is checked against the Framework release of framework.lock.json.
# The kit (scripts/effect-kit.mjs of simai/ui-source) runs against distr/core
# of simai/ui; both repositories are fetched at the locked commits only, into
# RUNNER_TEMP, and read with git archive / git show. The browser smoke answers
# jsDelivr from those git objects and from this checkout, so it needs no
# network beyond GitHub and npm. pages.yml deploys only after this workflow
# passes on main.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The smoke serves the snippets' files from git at this commit.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.5"
      - run: npm ci --no-audit --no-fund
      - name: Catalogue is current and every effect passes
        run: node scripts/build-catalogue.mjs --check
      - name: No local paths, no secret-shaped strings, offline modules
        run: node scripts/check-hygiene.mjs
      - name: Fetch the Framework at the lock
        run: |
          set -euo pipefail
          parent="$RUNNER_TEMP/framework"
          fetch() {
            git init --quiet "$parent/$2"
            for attempt in 1 2 3; do
              git -C "$parent/$2" fetch --quiet --depth 1 "https://github.com/$1.git" "$3" && break
              [ "$attempt" -lt 3 ] || return 1
              sleep 10
            done
            git -C "$parent/$2" cat-file -e "$3^{commit}"
            echo "$1 $3 -> $parent/$2"
          }
          fetch "$(jq -r '.ui.repository' framework.lock.json)" ui "$(jq -r '.ui.commit' framework.lock.json)"
          fetch "$(jq -r '.ui_source.repository' framework.lock.json)" ui-source "$(jq -r '.ui_source.commit' framework.lock.json)"
          {
            echo "UI_ROOT=$parent/ui"
            echo "UI_SOURCE_ROOT=$parent/ui-source"
            echo "KIT_WORK=$RUNNER_TEMP/kit"
          } >> "$GITHUB_ENV"
      # playwright-core is pinned in package.json and installs the Chromium of
      # that exact version.
      - name: Install the pinned Chromium
        run: npx --no-install playwright-core install --with-deps --only-shell chromium
      - name: Framework kit on every effect and scheme, and the template
        run: node scripts/kit.mjs --template
      - name: Kit results reproduce the committed ones
        run: git diff --exit-code -- catalogue/
      - name: Build the site
        run: UI_EFFECTS_COMMIT="$GITHUB_SHA" node scripts/build-site.mjs
      - name: Browser smoke under /ui-effects/
        timeout-minutes: 20
        run: node scripts/smoke.mjs --prefix /ui-effects/ --shots "$RUNNER_TEMP/shots" --json "$RUNNER_TEMP/smoke.json"
      - name: Keep the smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/smoke.json
          retention-days: 7
