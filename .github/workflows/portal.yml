name: Portal release

# A tag vX.Y.Z on a main commit that passed Quality publishes the catalogue's
# portal artifact as a GitHub release: the site built for
# https://simai.io/ru/framework/effects/, its sha256 and its receipt
# (simai/simai.io docs/ASSEMBLY.md). A release is never replaced: the portal
# pins its digest.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  actions: read

concurrency:
  group: portal-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.5"
      - name: The tag is on main and passed Quality
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          conclusion=$(gh run list -R "$GITHUB_REPOSITORY" -w Quality --commit "$GITHUB_SHA" --json conclusion -q 'map(select(.conclusion == "success")) | length')
          test "$conclusion" -ge 1
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then echo "release $TAG exists; it is never replaced"; exit 1; fi
      - run: npm ci --no-audit --no-fund
      - name: Pack the portal artifact
        run: node scripts/pack-portal.mjs --release "$TAG" --commit "$GITHUB_SHA" --out portal-release
      - name: Publish the release
        run: |
          set -euo pipefail
          cd portal-release
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes "Catalogue $TAG at ${GITHUB_SHA}. Portal artifact for https://simai.io/ru/framework/effects/; the receipt holds its sha256." \
            framework-effects-"$TAG"-portal.tar.gz \
            framework-effects-"$TAG"-portal.tar.gz.sha256 \
            framework-effects-"$TAG"-portal-receipt.json
